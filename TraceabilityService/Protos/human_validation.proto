syntax = "proto3";

package document.validation.v1;

option go_package = "github.com/AndrewK4758/shared_protos";

import "models.proto";
import "google/protobuf/struct.proto";

service HumanValidationService {
  // Orchestrator or Client registers a task needing human validation
  rpc CreateValidationTask(CreateTaskRequest) returns (CreateTaskResponse);

  // Retrieve pending tasks for review
  rpc GetPendingTasks(GetPendingTasksRequest) returns (stream PendingTask);

  // Submit corrected JSON from human UI or script
  rpc SubmitCorrection(SubmitCorrectionRequest) returns (SubmitCorrectionResponse);

  // Force delete a corrupt or legacy task from the in-memory queue without resuming the job
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
}

message DeleteTaskRequest {
  string task_id = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
}

message DeleteTaskResponse {
  bool success = 1;
}

message CreateTaskRequest {
  document.models.v1.InfrastructureIdentity identity = 1;
  string step_name = 2;
  string failed_ai_output = 3;
  reserved 4;
  string prompt_instructions = 5;
  string error_message = 6;
  repeated string target_fields = 7;
  document.models.v1.GlobalState global_state = 8;
  reserved 9; reserved "job_name";
  string step_id = 10;
  string step_context_input = 11;
  map<string, string> metadata = 12;
  google.protobuf.Struct expected_schema = 13;
}

message CreateTaskResponse {
  string task_id = 1;
  string status = 2; // e.g., "CREATED"
}

message GetPendingTasksRequest {
  string filter_status = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
}

message PendingTask {
  string task_id = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
  string step_name = 3;
  string failed_ai_output = 4;
  reserved 5;
  string prompt_instructions = 6;
  string error_message = 7;
  repeated string target_fields = 8;
  string status = 9; // e.g., "PENDING", "RESOLVED"
  document.models.v1.GlobalState global_state = 10;
  reserved 11; reserved "job_name";
  string step_id = 12;
  string step_context_input = 13;
  map<string, string> metadata = 14;
  google.protobuf.Struct expected_schema = 15;
}

message GetPendingTasksResponse {
  repeated PendingTask tasks = 1;
}

message SubmitCorrectionRequest {
  string task_id = 1;
  google.protobuf.Struct corrected = 2;
  document.models.v1.InfrastructureIdentity identity = 3;
}

message SubmitCorrectionResponse {
  bool success = 1;
  string message = 2;
}
